<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lineup Bridge</title>
    <style>
      :root {
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f7fb;
        color: #111827;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .container {
        width: min(100%, 960px);
        background: #ffffff;
        border: 1px solid rgba(15, 23, 42, 0.08);
        border-radius: 28px;
        padding: 48px;
        box-shadow: 0 24px 80px rgba(15, 23, 42, 0.08);
        text-align: center;
      }
      .logo {
        width: min(300px, 100%);
        height: auto;
        margin: 0 auto 30px;
      }
      h1 {
        margin: 0;
        font-size: clamp(2rem, 3vw, 3.4rem);
        line-height: 1.05;
      }
      p {
        margin: 24px auto 0;
        max-width: 720px;
        color: #475569;
        font-size: 1rem;
        line-height: 1.75;
      }
      a.button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 36px;
        padding: 16px 30px;
        border-radius: 999px;
        background: #7c3aed;
        color: #ffffff;
        text-decoration: none;
        font-weight: 700;
        box-shadow: 0 18px 50px rgba(124, 58, 237, 0.18);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img src="static/media/brand-logo.png" alt="Lineup Bridge" class="logo" />
      <h1>Welcome to Lineup Bridge</h1>
      <p>
        This is your standalone one-page landing page ready for Vercel deployment.
        It uses the existing logo from the application assets and is isolated from the full web app build.
      </p>
      <a class="button" href="https://vercel.com/new">Deploy to Vercel</a>
    </div>
  </body>
</html>
