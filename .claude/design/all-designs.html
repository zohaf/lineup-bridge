<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LineupBridge All Designs</title>
<style>
  :root { --bg:#f6f6f4; --fg:#111; --muted:#666; --line:#ddd; --card:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  header { position:sticky; top:0; z-index:2; background:var(--card); border-bottom:1px solid var(--line);
    padding:12px 16px; }
  h1 { margin:0 0 6px; font-size:18px; }
  nav { display:flex; flex-wrap:wrap; gap:6px 14px; font-size:13px; }
  nav b { color:var(--muted); font-weight:600; }
  a { color:inherit; }
  main { max-width:1440px; margin:0 auto; padding:16px; }
  h2 { margin:32px 0 8px; font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
  section { background:var(--card); border:1px solid var(--line); border-radius:8px; margin:0 0 20px; overflow:hidden; scroll-margin-top:90px; }
  .bar { display:flex; justify-content:space-between; gap:12px; padding:10px 14px; border-bottom:1px solid var(--line); font-size:14px; }
  .bar span { color:var(--muted); font-size:12px; }
  iframe { display:block; width:100%; height:900px; border:0; background:#fff; }
</style>
</head>
<body>
<header>
  <h1>LineupBridge: all design files</h1>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<script>
const groups = [
  ["Pages", [
    ["landing-page.html", "Landing"],
    ["header.html", "Header"],
    ["footer.html", "Footer"],
    ["home-page.html", "Home"],
    ["content-pages.html", "Content pages"],
    ["public-profile-page.html", "Public profile"],
    ["offer-builder-page.html", "Offer builder"],
    ["booking-journey.html", "Booking journey (to payment)"],
    ["dj-setup.html", "Account and public profile setup"],
  ]],
  ["System", [
    ["components.html", "UI library"],
    ["layouts.html", "Layouts"],
  ]],
  ["Plans and explorations", [
    ["header-journey.html", "Header plan"],
    ["proposed-changes-options.html", "Proposed changes options"],
    ["brand-exploration.html", "Brand exploration"],
    ["logo-font-study.html", "Color palette / logo"],
    ["logo-typography.html", "Logo typography"],
    ["logo-landing-prototypes.html", "Logo prototypes"],
    ["landing-logo-jost.html", "Landing Jost logo"],
  ]],
];
const nav = document.getElementById("nav"), main = document.getElementById("main");
for (const [g, items] of groups) {
  nav.insertAdjacentHTML("beforeend", `<b>${g}:</b>`);
  main.insertAdjacentHTML("beforeend", `<h2>${g}</h2>`);
  for (const [file, name] of items) {
    const id = file.replace(".html", "");
    nav.insertAdjacentHTML("beforeend", `<a href="#${id}">${name}</a>`);
    main.insertAdjacentHTML("beforeend",
      `<section id="${id}"><div class="bar"><strong>${name}</strong>
       <span>${file} · <a href="${file}" target="_blank">open full</a></span></div>
       <iframe src="${file}" loading="lazy" title="${name}"></iframe></section>`);
  }
}
</script>
</body>
</html>
