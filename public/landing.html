<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lineup Bridge</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #111827;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .page {
        width: min(100%, 940px);
        background: #ffffff;
        border: 1px solid rgba(15, 23, 42, 0.08);
        border-radius: 28px;
        padding: 48px;
        box-shadow: 0 24px 80px rgba(15, 23, 42, 0.08);
      }
      .logo {
        display: block;
        margin: 0 auto 32px;
        max-width: 320px;
        width: 100%;
        height: auto;
      }
      .hero {
        text-align: center;
      }
      .hero h1 {
        font-size: clamp(2.1rem, 3vw, 3.4rem);
        margin: 0;
        line-height: 1.05;
      }
      .hero p {
        margin: 24px auto 0;
        max-width: 680px;
        color: #475569;
        font-size: 1.05rem;
        line-height: 1.7;
      }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 36px;
        padding: 16px 28px;
        border-radius: 999px;
        border: none;
        background: #7c3aed;
        color: #fff;
        text-decoration: none;
        font-weight: 700;
        font-size: 1rem;
        box-shadow: 0 18px 50px rgba(124, 58, 237, 0.18);
      }
    </style>
  </head>
  <body>
    <main class="page">
      <img src="/static/media/brand-logo.png" alt="Lineup Bridge" class="logo" />
      <section class="hero">
        <h1>Lineup Bridge</h1>
        <p>
          Welcome to the Lineup Bridge landing page. This standalone page is ready for Vercel deployment.
          The rest of the application can be deployed later from the existing app repository.
        </p>
        <a href="https://vercel.com/new" class="button">Deploy to Vercel</a>
      </section>
    </main>
  </body>
</html>
